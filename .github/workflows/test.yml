name: test

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"

        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: setup sccache
              if: runner.os != 'Windows'
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: install checks (windows)
              if: runner.os == 'Windows'
              run: |
                  choco install cppcheck llvm --yes
                  echo "C:\Program Files\Cppcheck" >> $env:GITHUB_PATH
                  echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

            - name: verify clang-tidy (windows)
              if: runner.os == 'Windows'
              run: clang-tidy --version

            - name: install system dependencies (ubuntu)
              if: runner.os == 'Linux'
              run: |
                sudo apt-get update
                sudo apt-get update && sudo apt-get install -y \
                build-essential cmake ninja-build clang-tidy libgl1-mesa-dev \
                libssl-dev libcurl4-openssl-dev libuv1-dev zlib1g-dev \
                libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
                libegl1-mesa-dev libdecor-0-dev libxtst-dev libgtk-3-dev

            - name: setup msvc
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1

            - name: setup env
              run: python ./ez init

            - name: configure
              run: python ./ez configure --type="debug"
              env:
               SCCACHE_GHA_ENABLED: "true"

            - name: check
              run: python ./ez check --type="debug"

            - name: test
              run: python ./ez tests
              env:
                  OSU_ID: ${{ secrets.OSU_ID }}
                  OSU_SECRET: ${{ secrets.OSU_SECRET }}

            - name: sccache stats
              if: runner.os == 'Linux'
              run: sccache --show-stats
