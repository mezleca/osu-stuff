name: test

on:
    workflow_dispatch:
    pull_request:
        paths:
            - "src/**"
            - "tests/**"
            - "vendor/**"
            - "CMakeLists.txt"
            - "ez"
            - ".clang-tidy"
            - ".gitmodules"
            - ".github/workflows/test.yml"
    push:
        branches: [main]
        paths:
            - "src/**"
            - "tests/**"
            - "vendor/**"
            - "CMakeLists.txt"
            - "ez"
            - ".clang-tidy"
            - ".gitmodules"
            - ".github/workflows/test.yml"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            SCCACHE_GHA_ENABLED: "true"

        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                  build-essential cmake ninja-build clang clang-tidy libgl1-mesa-dev \
                  libssl-dev libcurl4-openssl-dev libuv1-dev zlib1g-dev \
                  libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
                  libegl1-mesa-dev libdecor-0-dev libxtst-dev libgtk-3-dev

            - name: setup env
              run: python ./ez init

            - name: check
              run: python ./ez check --type="debug"

            - name: sccache stats
              run: sccache --show-stats

    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"

        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: setup sccache
              if: runner.os != 'Windows'
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: install system dependencies (ubuntu)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                  build-essential cmake ninja-build clang libgl1-mesa-dev \
                  libssl-dev libcurl4-openssl-dev libuv1-dev zlib1g-dev \
                  libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
                  libegl1-mesa-dev libdecor-0-dev libxtst-dev libgtk-3-dev

            - name: setup msvc
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1

            - name: setup env
              run: python ./ez init

            - name: test
              run: python ./ez tests
              env:
                  OSU_ID: ${{ secrets.OSU_ID }}
                  OSU_SECRET: ${{ secrets.OSU_SECRET }}

            - name: sccache stats
              if: runner.os == 'Linux'
              run: sccache --show-stats
